name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Package immutable artifact
        run: tar -czf securehome-iot-${{ github.sha }}.tar.gz dist vercel.json
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: securehome-iot-${{ github.sha }}
          path: securehome-iot-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
